name: Build Rinova Pro Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Official Google Platform-Tools (ADB for Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "temp_adb"
          New-Item -ItemType Directory -Force -Path "platform-tools"
          Copy-Item "temp_adb\platform-tools\adb.exe" "platform-tools\"
          Copy-Item "temp_adb\platform-tools\AdbWinApi.dll" "platform-tools\"
          Copy-Item "temp_adb\platform-tools\AdbWinUsbApi.dll" "platform-tools\"
          Remove-Item -Recurse -Force "temp_adb"
          Remove-Item "platform-tools.zip"

      - name: Compile Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller build.spec

      - name: Assemble Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\RinovaPro"
          Copy-Item "dist\RinovaPro.exe" "release\RinovaPro\"
          Copy-Item -Recurse "platform-tools" "release\RinovaPro\"
          Compress-Archive -Path "release\RinovaPro\*" -DestinationPath "RinovaPro-Windows-Portable.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RinovaPro-Windows-Portable
          path: RinovaPro-Windows-Portable.zip
          retention-days: 14

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Rinova Pro ${{ github.ref_name }}
          files: RinovaPro-Windows-Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
